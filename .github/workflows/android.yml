name: KOX PES2018 Android APK # Rebuild after per-CPK selection UI
# Rebuild after Multi-Patch compile fix

'on':
  workflow_dispatch:
  push:
    branches: [ main, kox-live-controls-development ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout KOX build scripts
        uses: actions/checkout@v4

      - name: Checkout PES2018 Recomp 0.3.2 source
        uses: actions/checkout@v4
        with:
          repository: sharifhidayatulloh/pes2018-recomp
          ref: 0.3.2
          path: upstream
          persist-credentials: false

      - name: Inject KOX DpFileList composer and tests
        run: |
          mkdir -p upstream/android/app/src/main/java/com/koxain/patchmanager
          mkdir -p upstream/android/app/src/test/java/com/koxain/patchmanager
          cp kox-patch-manager/DpFileListComposer.kt upstream/android/app/src/main/java/com/koxain/patchmanager/
          cp kox-patch-manager/MultiPatchInstaller.kt upstream/android/app/src/main/java/com/koxain/patchmanager/
          cp kox-patch-manager/MultiPatchActivity.kt upstream/android/app/src/main/java/com/pes2017/recomp/
          cp kox-patch-manager/DpFileListComposerTest.kt upstream/android/app/src/test/java/com/koxain/patchmanager/
          cp kox-patch-manager/MultiPatchInstallerTest.kt upstream/android/app/src/test/java/com/koxain/patchmanager/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install host build tools and Android components
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build git
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Download private PES2018 XEX release asset
        env:
          GH_TOKEN: ${{ secrets.XEX_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "XEX_REPO_TOKEN secret is missing"; exit 1; }
          mkdir -p upstream/GAME
          gh release download pes2018-input \
            --repo KOXAIN48/PES2018-KOX-PRIVATE \
            --pattern default.xex \
            --dir upstream/GAME
          test -s upstream/GAME/default.xex
          XEX_SHA256=$(sha256sum upstream/GAME/default.xex | awk '{print $1}')
          echo "PES17_XEX_SHA256_SP=$XEX_SHA256" >> "$GITHUB_ENV"
          echo "PES17_XEX_SHA256_MP=$XEX_SHA256" >> "$GITHUB_ENV"
          echo "Private XEX downloaded and checksum recorded."

      - name: Apply KOX Mali GPU load-scaling patch
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/java/com/pes2017/recomp/DeviceProfile.kt")
          s = p.read_text()
          old = "Tier.MEDIUM -> Preset(75, multisampling = true, fsr = true, fpsLimit = 60, lowMemory = false, heatScale = true, loadScale = false)"
          new = "Tier.MEDIUM -> Preset(75, multisampling = true, fsr = true, fpsLimit = 60, lowMemory = false, heatScale = false, loadScale = true)"
          if s.count(old) != 1:
              raise SystemExit("Patch guard failed: expected exactly one Medium preset line")
          p.write_text(s.replace(old, new))

          # Faster GPU-load recovery after transient camera-heavy scenes.
          dyn = Path("runtime/gpu/vulkan/dynamic_scale.h")
          ds = dyn.read_text()
          for before, after, label in [
              ("static constexpr int kWindow = 90;", "static constexpr int kWindow = 45;", "decision window"),
              ("static constexpr int kCooldownWindows = 2;", "static constexpr int kCooldownWindows = 1;", "cooldown"),
              ("static constexpr int kUpWindows = 3;", "static constexpr int kUpWindows = 1;", "recovery windows"),
          ]:
              if ds.count(before) != 1:
                  raise SystemExit(f"Dynamic-scale {label} patch anchor mismatch")
              ds = ds.replace(before, after)
          dyn.write_text(ds)

          # Extend Frame Limit from 30-60 to 30-120 FPS in 5 FPS steps.
          prefs = Path("android/app/src/main/java/com/pes2017/recomp/Prefs.kt")
          ps = prefs.read_text()
          ps, n_get = re.subn(r'\.coerceIn\(30, 60\)', '.coerceIn(30, 120)', ps)
          if n_get != 2:
              raise SystemExit(f"Frame Limit preference patch guard failed: {n_get}")
          prefs.write_text(ps)

          settings = Path("android/app/src/main/java/com/pes2017/recomp/SettingsActivity.kt")
          ss = settings.read_text()
          ss, n_bar = re.subn(r'bar\(R\.id\.fps_limit, R\.id\.fps_limit_label, 6,', 'bar(R.id.fps_limit, R.id.fps_limit_label, 18,', ss)
          old_label = '{ if (it == 6) getString(R.string.fps_limit_off) else getString(R.string.fps_limit, 30 + it * 5) }'
          if n_bar != 1 or ss.count(old_label) != 1:
              raise SystemExit("Frame Limit slider patch guard failed")
          ss = ss.replace(old_label, '{ getString(R.string.fps_limit, 30 + it * 5) }')
          settings.write_text(ss)

          game = Path("android/app/src/main/java/com/pes2017/recomp/GameActivity.kt")
          gs = game.read_text()
          old_limit = '''        val fpsLimit = when {
                      prefs.frameGeneration -> "30"
                      prefs.fpsLimit < 60 -> prefs.fpsLimit.toString()
                      else -> ""
                  }
                  NativeBridge.nativeSetOption("PES17_FPS_LIMIT", fpsOverride?.takeIf { it.isNotEmpty() } ?: fpsLimit)'''
          new_limit = '''        val fpsLimit = when {
                      prefs.frameGeneration -> "30"
                      else -> prefs.fpsLimit.toString()
                  }
                  NativeBridge.nativeSetOption("PES17_FPS_LIMIT", fpsOverride?.takeIf { it.isNotEmpty() } ?: fpsLimit)'''
          if gs.count(old_limit) != 1:
              raise SystemExit("Frame Limit native dispatch patch guard failed")
          game.write_text(gs.replace(old_limit, new_limit))

          frame_rate = Path("runtime/frame_rate.h").read_text()
          if "limit >= kConsole" not in frame_rate or "com_maxfps" not in frame_rate:
              raise SystemExit("Native FPS pacing support verification failed")

                    # Keep upstream frame pacing unchanged; the injected live-deadline reset regressed replay transitions.
          frame_rate = Path("runtime/frame_rate.h").read_text()
          if "static const uint32_t limit" not in frame_rate or "previousLimit" in frame_rate:
              raise SystemExit("Stable upstream FPS pacing verification failed")

          # Extend the texture-memory slider to 12 GB (96 x 128 MB).
          root = Path(".")
          settings = root / "android/app/src/main/java/com/pes2017/recomp/SettingsActivity.kt"
          s = settings.read_text()
          s, n1 = re.subn(r'bar\(R\.id\.texture_budget, R\.id\.texture_label, 15,', 'bar(R.id.texture_budget, R.id.texture_label, 96,', s)
          s, n2 = re.subn(r'\.coerceIn\(1, 15\)', '.coerceIn(1, 96)', s)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Texture slider patch guard failed: max={n1}, clamp={n2}")
          settings.write_text(s)

          # Store a selectable display refresh rate.
          prefs = root / "android/app/src/main/java/com/pes2017/recomp/Prefs.kt"
          s = prefs.read_text()
          old_property = """    var prefer60Hz: Boolean
                  get() = store.getBoolean(KEY_60HZ, true)
                  set(value) = store.edit().putBoolean(KEY_60HZ, value).apply()"""
          new_property = """    var displayRefreshRate: Int
                  get() = store.getInt(KEY_DISPLAY_REFRESH_RATE, 60).let { if (it in intArrayOf(30, 60, 90, 120)) it else 60 }
                  set(value) = store.edit().putInt(KEY_DISPLAY_REFRESH_RATE, value.takeIf { it in intArrayOf(30, 60, 90, 120) } ?: 60).apply()"""
          if s.count(old_property) != 1:
              raise SystemExit("Display preference property patch guard failed")
          s = s.replace(old_property, new_property)
          old_key = '        private const val KEY_60HZ = "prefer60Hz"'
          new_key = '        private const val KEY_DISPLAY_REFRESH_RATE = "displayRefreshRate"'
          if s.count(old_key) != 1:
              raise SystemExit("Display preference key patch guard failed")
          prefs.write_text(s.replace(old_key, new_key))

          # Replace the legacy toggle with a 30/60/90/120-Hz selector.
          settings = root / "android/app/src/main/java/com/pes2017/recomp/SettingsActivity.kt"
          s = settings.read_text()
          old = '        switch(R.id.prefer60, prefs.prefer60Hz) { prefs.prefer60Hz = it }'
          new = '''        run {
              val oldSwitch = findViewById<SwitchCompat>(R.id.prefer60)
              val group = oldSwitch.parent as android.view.ViewGroup
              val index = group.indexOfChild(oldSwitch)
              oldSwitch.visibility = android.view.View.GONE
              if (index + 1 < group.childCount) group.getChildAt(index + 1).visibility = android.view.View.GONE
              val label = TextView(this).apply {
                  text = "Lock Display Refresh Rate"
                  setPadding(0, 8, 0, 4)
              }
              val spinner = android.widget.Spinner(this)
              val labels = listOf("30 Hz", "60 Hz", "90 Hz", "120 Hz")
              val rates = intArrayOf(30, 60, 90, 120)
              spinner.adapter = android.widget.ArrayAdapter(
                  this, android.R.layout.simple_spinner_item, labels
              ).also { it.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item) }
              group.addView(label, index, android.view.ViewGroup.LayoutParams(
                  android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                  android.view.ViewGroup.LayoutParams.WRAP_CONTENT
              ))
              group.addView(spinner, index + 1, android.view.ViewGroup.LayoutParams(
                  android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                  android.view.ViewGroup.LayoutParams.WRAP_CONTENT
              ))
              spinner.setSelection(rates.indexOf(prefs.displayRefreshRate).coerceAtLeast(0), false)
              spinner.onItemSelectedListener = object : android.widget.AdapterView.OnItemSelectedListener {
                  override fun onNothingSelected(parent: android.widget.AdapterView<*>?) = Unit
                  override fun onItemSelected(parent: android.widget.AdapterView<*>?, view: android.view.View?, position: Int, id: Long) {
                      prefs.displayRefreshRate = rates[position]
                  }
              }
          }'''
          if s.count(old) != 1:
              raise SystemExit("Display selector patch guard failed in SettingsActivity.kt")
          settings.write_text(s.replace(old, new))

          # Apply the selected refresh rate, using the closest supported panel mode.
          game = root / "android/app/src/main/java/com/pes2017/recomp/GameActivity.kt"
          s = game.read_text()
          old_game = """        // Frame generation pairs a 30 fps game with a 60 Hz screen (PES17_FRAMEGEN).
                  if (prefs.prefer60Hz || prefs.frameGeneration) {
                      val attributes = window.attributes
                      attributes.preferredRefreshRate = 60f
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val displayObj = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) display
                          else {
                              @Suppress("DEPRECATION")
                              windowManager.defaultDisplay
                          }
                          if (displayObj != null) {
                              val mode60 = displayObj.supportedModes.firstOrNull { kotlin.math.abs(it.refreshRate - 60f) < 1f }
                              if (mode60 != null) {
                                  attributes.preferredDisplayModeId = mode60.modeId
                              }
                          }
                      }
                      window.attributes = attributes
                  }"""
          new_game = """        // Frame generation requires 60 Hz; otherwise use the user's selected panel rate.
                  run {
                      val targetHz = if (prefs.frameGeneration) 60 else prefs.displayRefreshRate
                      val attributes = window.attributes
                      attributes.preferredRefreshRate = targetHz.toFloat()
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val displayObj = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) display else {
                              @Suppress("DEPRECATION")
                              windowManager.defaultDisplay
                          }
                          val mode = displayObj?.supportedModes?.minByOrNull {
                              kotlin.math.abs(it.refreshRate - targetHz.toFloat())
                          }
                          if (mode != null) attributes.preferredDisplayModeId = mode.modeId
                      }
                      window.attributes = attributes
                  }"""
          if s.count(old_game) != 1:
              raise SystemExit("Refresh-rate runtime block patch guard failed in GameActivity.kt")
          game.write_text(s.replace(old_game, new_game))

          # Update diagnostic text after removing the legacy prefer60Hz preference.
          capture = root / "android/app/src/main/java/com/pes2017/recomp/CaptureSession.kt"
          s = capture.read_text()
          old_capture_ref = "60 Hz lock ${prefs.prefer60Hz}"
          new_capture_ref = "selected refresh ${prefs.displayRefreshRate} Hz"
          if s.count(old_capture_ref) != 2:
              raise SystemExit("CaptureSession display preference patch guard failed")
          s = s.replace(old_capture_ref, new_capture_ref)
          if "prefs.prefer60Hz" in s:
              raise SystemExit("Legacy prefer60Hz reference remains in CaptureSession.kt")
          capture.write_text(s)

          # Fix the in-game Graphics & Performance dialog contrast and expose
          # the existing internal-render / match-render controls with clear names.
          quick = root / "android/app/src/main/java/com/pes2017/recomp/QuickGraphics.kt"
          qs = quick.read_text()
          old_import = "import android.app.Activity"
          if qs.count(old_import) != 1:
              raise SystemExit("QuickGraphics color import patch guard failed")
          qs = qs.replace(old_import, old_import + "\nimport android.graphics.Color")
          old_label = 'fun label(text: String) = TextView(activity).apply { this.text = text; textSize = 13f; setPadding(0, px(10), 0, 0) }'
          new_label = 'fun label(text: String) = TextView(activity).apply { this.text = text; textSize = 13f; setTextColor(Color.rgb(0, 0, 0)); setPadding(0, px(10), 0, 0) }'
          if qs.count(old_label) != 1:
              raise SystemExit("QuickGraphics label contrast patch guard failed")
          qs = qs.replace(old_label, new_label)
          old_radio = 'RadioButton(activity).apply { text = tier.name.lowercase().replaceFirstChar { it.uppercase() }; id = View.generateViewId() }'
          new_radio = 'RadioButton(activity).apply { text = tier.name.lowercase().replaceFirstChar { it.uppercase() }; setTextColor(Color.rgb(10, 27, 69)); id = View.generateViewId() }'
          if qs.count(old_radio) != 1:
              raise SystemExit("QuickGraphics preset contrast patch guard failed")
          qs = qs.replace(old_radio, new_radio)
          old_switch = 'fun switch(text: String) = SwitchCompat(activity).apply { this.text = text; setPadding(0, px(6), 0, px(6)) }'
          new_switch = 'fun switch(text: String) = SwitchCompat(activity).apply { this.text = text; setTextColor(Color.rgb(10, 27, 69)); setPadding(0, px(6), 0, px(6)) }'
          if qs.count(old_switch) != 1:
              raise SystemExit("QuickGraphics toggle contrast patch guard failed")
          qs = qs.replace(old_switch, new_switch)
          qs = qs.replace('val fps = SeekBar(activity).apply { max = 6 }', 'val fps = SeekBar(activity).apply { max = 18 }')
          qs = qs.replace('fps.progress = (v.fps - 30) / 5', 'fps.progress = ((v.fps - 30) / 5).coerceIn(0, 18)')
          qs = qs.replace('v.fps = 30 + value * 5; fpsText.text', 'v.fps = 30 + value * 5; prefs.fpsLimit = v.fps; NativeBridge.nativeSetOption("PES17_FPS_LIMIT", v.fps.toString()); fpsText.text')
          # Put HUD color selection directly in the in-game Graphics & Performance menu.
          color_anchor = '        val fpsText = label("")'
          color_block = '''        val hudColorNames = listOf("Black", "White", "Gray", "Silver", "Red", "Crimson", "Pink", "Orange", "Amber", "Yellow", "Gold", "Lime", "Green", "Mint", "Cyan", "Sky Blue", "Blue", "Navy")
                  val hudColorValues = listOf("#D70B0B0B", "#D7FFFFFF", "#D7666666", "#D7BFC7D5", "#D7E53935", "#D7A31525", "#D7EC407A", "#D7FB8C00", "#D7FFB300", "#D7FDD835", "#D7D4AF37", "#D7AEEA00", "#D743A047", "#D74DB6AC", "#D700BCD4", "#D703A9F4", "#D72196F3", "#D7153A73")
                  val hudColorPicker = android.widget.Spinner(activity).apply {
                      adapter = android.widget.ArrayAdapter(activity, android.R.layout.simple_spinner_dropdown_item, hudColorNames)
                      setSelection(hudColorValues.indexOf(prefs.hudColor).coerceAtLeast(0))
                      onItemSelectedListener = object : android.widget.AdapterView.OnItemSelectedListener {
                          override fun onNothingSelected(parent: android.widget.AdapterView<*>?) = Unit
                          override fun onItemSelected(parent: android.widget.AdapterView<*>?, view: View?, position: Int, id: Long) {
                              (activity as? GameActivity)?.applyHudTextColor(hudColorValues[position])
                          }
                      }
                  }
          '''
          if qs.count(color_anchor) != 1:
              raise SystemExit("QuickGraphics HUD color picker anchor mismatch")
          qs = qs.replace(color_anchor, color_block + color_anchor)
          fps_view_anchor = '        column.addView(fpsText); column.addView(fps)'
          if qs.count(fps_view_anchor) != 1:
              raise SystemExit("QuickGraphics HUD color picker view anchor mismatch")
          qs = qs.replace(fps_view_anchor, fps_view_anchor + '''
                  column.addView(label("FPS HUD color"))
                  column.addView(hudColorPicker)''')
          apply_anchor = '.setPositiveButton(R.string.qg_apply) { _, _ ->'
          if qs.count(apply_anchor) != 1:
              raise SystemExit("QuickGraphics HUD color apply anchor mismatch")
          qs = qs.replace(apply_anchor, apply_anchor + '''
                          prefs.hudColor = hudColorValues[hudColorPicker.selectedItemPosition.coerceIn(0, hudColorValues.lastIndex)]''')
          old_note = 'setText(R.string.qg_note); textSize = 11f; alpha = 0.7f; setPadding(0, px(10), 0, 0)'
          new_note = 'setText(R.string.qg_note); textSize = 11f; setTextColor(Color.rgb(0, 0, 0)); alpha = 1f; setPadding(0, px(10), 0, 0)'
          if qs.count(old_note) != 1:
              raise SystemExit("QuickGraphics note contrast patch guard failed")
          qs = qs.replace(old_note, new_note)
          if 'max = 18' not in qs or 'setTextColor(Color.rgb(10, 27, 69))' not in qs:
              raise SystemExit("QuickGraphics visibility / FPS verification failed")
          quick.write_text(qs)

          strings = root / "android/app/src/main/res/values/strings.xml"
          rs = strings.read_text()
          old_scene = '<string name="qg_scene">Scene resolution: %1$d%%</string>'
          new_scene = '<string name="qg_scene">Match render quality: %1$d%%</string>'
          old_scale = '<string name="qg_scale">Internal resolution: %1$dx (1x = 1280x720; 2x or 3x for powerful GPUs)</string>'
          new_scale = '<string name="qg_scale">Internal render multiplier: %1$dx (1x = 1280x720; 2x or 3x for powerful GPUs)</string>'
          if rs.count(old_scene) != 1 or rs.count(old_scale) != 1:
              raise SystemExit("Graphics render labels patch guard failed")
          strings.write_text(rs.replace(old_scene, new_scene).replace(old_scale, new_scale))

          # KOX selectable display surface resolution, with aspect-ratio fitting.
          prefs = root / "android/app/src/main/java/com/pes2017/recomp/Prefs.kt"
          ps = prefs.read_text()
          anchor = '''    var resolutionScale: Float
                  get() = store.getFloat(KEY_RESOLUTION, 0f).let { if (it <= 0f) 1.0f else it }
                  set(value) = store.edit().putFloat(KEY_RESOLUTION, value.coerceIn(0.35f, 1.0f)).apply()
          '''
          if ps.count(anchor) != 1: raise SystemExit("Display resolution preference anchor mismatch")
          ps = ps.replace(anchor, anchor + '''
              /** Output surface size; separate from the internal 1280x720 render base. */
              var displayResolutionWidth: Int
                  get() = store.getInt(KEY_DISPLAY_WIDTH, 2712).coerceIn(320, 7680)
                  set(value) = store.edit().putInt(KEY_DISPLAY_WIDTH, value.coerceIn(320, 7680)).apply()
              var displayResolutionHeight: Int
                  get() = store.getInt(KEY_DISPLAY_HEIGHT, 1220).coerceIn(240, 4320)
                  set(value) = store.edit().putInt(KEY_DISPLAY_HEIGHT, value.coerceIn(240, 4320)).apply()
          ''')
          key = '        private const val KEY_RESOLUTION = "resolutionScale"'
          if ps.count(key) != 1: raise SystemExit("Display resolution key anchor mismatch")
          ps = ps.replace(key, key + '''
                  private const val KEY_DISPLAY_WIDTH = "displayResolutionWidth"
                  private const val KEY_DISPLAY_HEIGHT = "displayResolutionHeight"''')
          prefs.write_text(ps)

          settings = root / "android/app/src/main/java/com/pes2017/recomp/SettingsActivity.kt"
          ss = settings.read_text()
          pattern = r'(?m)^\s*bar\(R\.id\.resolution, R\.id\.resolution_label, 65, \(\(prefs\.resolutionScale \* 100f\) - 35f\)\.roundToInt\(\),\s*\{ getString\(R\.string\.resolution, it \+ 35\) \}\) \{ prefs\.resolutionScale = \(it \+ 35\) / 100f \}'
          ss, replaced = re.subn(pattern, "        setupDisplayResolutionControl()", ss)
          if replaced != 1: raise SystemExit(f"Display resolution settings anchor mismatch: {replaced}")
          anchor = "    private fun bar("
          if ss.count(anchor) != 1: raise SystemExit("Display resolution method anchor mismatch")
          method = r'''    private fun setupDisplayResolutionControl() {
                  val label = findViewById<TextView>(R.id.resolution_label)
                  val oldSeek = findViewById<SeekBar>(R.id.resolution)
                  val group = label.parent as? android.view.ViewGroup ?: return
                  label.visibility = android.view.View.GONE
                  oldSeek.visibility = android.view.View.GONE
                  if (group.childCount > 2) group.getChildAt(2).visibility = android.view.View.GONE
                  val button = Button(this).apply {
            text = "Display Resolution: " + prefs.displayResolutionWidth + " × " + prefs.displayResolutionHeight
            setOnClickListener { showDisplayResolutionDialog(this) }
                  }
                  group.addView(button, 1, android.view.ViewGroup.LayoutParams(
            android.view.ViewGroup.LayoutParams.MATCH_PARENT,
            android.view.ViewGroup.LayoutParams.WRAP_CONTENT
                  ))
              }

              private fun showDisplayResolutionDialog(button: Button) {
                  val wide = listOf(
            1120 to 504, 1160 to 522, 1200 to 540, 1240 to 558, 1280 to 576,
            1320 to 594, 1356 to 610, 1360 to 612, 1400 to 630, 1440 to 648,
            1480 to 666, 1520 to 684, 1560 to 702, 1600 to 720, 1640 to 738,
            1680 to 756, 1720 to 774, 1760 to 792, 1800 to 810, 1840 to 828,
            1880 to 846, 1920 to 864, 1960 to 882, 2000 to 900, 2040 to 918,
            2080 to 936, 2120 to 954, 2160 to 972, 2200 to 990, 2240 to 1008,
            2280 to 1026, 2320 to 1044, 2360 to 1062, 2400 to 1080, 2440 to 1098,
            2480 to 1116, 2520 to 1134, 2560 to 1152, 2600 to 1170, 2640 to 1188,
            2680 to 1206, 2712 to 1220
                  )
                  val standard = listOf(
            1024 to 576, 1152 to 648, 1280 to 720, 1366 to 768, 1600 to 900,
            1920 to 1080, 2048 to 1152, 2560 to 1440, 3200 to 1800,
            3840 to 2160, 5120 to 2880, 7680 to 4320
                  )
                  val choices = wide.map { Triple("20:9", it.first, it.second) } +
            standard.map { Triple("16:9", it.first, it.second) }
                  val labels = choices.map { it.first + " — " + it.second + " × " + it.third } + "Custom…"
                  val box = android.widget.LinearLayout(this).apply {
            orientation = android.widget.LinearLayout.VERTICAL
            setPadding(24, 12, 24, 4)
                  }
                  val spinner = android.widget.Spinner(this).apply {
            adapter = android.widget.ArrayAdapter(this@SettingsActivity, android.R.layout.simple_spinner_item, labels)
                .also { it.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item) }
                  }
                  val width = android.widget.EditText(this).apply {
            hint = "Custom width (320–7680)"
            inputType = android.text.InputType.TYPE_CLASS_NUMBER
            setText(prefs.displayResolutionWidth.toString())
                  }
                  val height = android.widget.EditText(this).apply {
            hint = "Custom height (240–4320)"
            inputType = android.text.InputType.TYPE_CLASS_NUMBER
            setText(prefs.displayResolutionHeight.toString())
                  }
                  box.addView(TextView(this).apply { text = "Aspect ratio / resolution" })
                  box.addView(spinner); box.addView(width); box.addView(height)
                  val selected = choices.indexOfFirst {
            it.second == prefs.displayResolutionWidth && it.third == prefs.displayResolutionHeight
                  }
                  spinner.setSelection(if (selected >= 0) selected else choices.size)
                  spinner.onItemSelectedListener = object : android.widget.AdapterView.OnItemSelectedListener {
