name: KOX PES2018 Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout KOX build scripts
        uses: actions/checkout@v4

      - name: Checkout PES2018 Recomp 0.3.2 source
        uses: actions/checkout@v4
        with:
          repository: sharifhidayatulloh/pes2018-recomp
          ref: 0.3.2
          path: upstream
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install host build tools and Android components
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build git
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Download private PES2018 XEX release asset
        env:
          GH_TOKEN: ${{ secrets.XEX_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "XEX_REPO_TOKEN secret is missing"; exit 1; }
          mkdir -p upstream/GAME
          gh release download pes2018-input \
            --repo KOXAIN48/PES2018-KOX-PRIVATE \
            --pattern default.xex \
            --dir upstream/GAME
          test -s upstream/GAME/default.xex
          XEX_SHA256=$(sha256sum upstream/GAME/default.xex | awk '{print $1}')
          echo "PES17_XEX_SHA256_SP=$XEX_SHA256" >> "$GITHUB_ENV"
          echo "PES17_XEX_SHA256_MP=$XEX_SHA256" >> "$GITHUB_ENV"
          echo "Private XEX downloaded and checksum recorded."

      - name: Apply KOX Mali GPU load-scaling patch
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/java/com/pes2017/recomp/DeviceProfile.kt")
          s = p.read_text()
          old = "Tier.MEDIUM -> Preset(75, multisampling = true, fsr = true, fpsLimit = 60, lowMemory = false, heatScale = true, loadScale = false)"
          new = "Tier.MEDIUM -> Preset(75, multisampling = true, fsr = true, fpsLimit = 60, lowMemory = false, heatScale = false, loadScale = false)"
          if s.count(old) != 1:
              raise SystemExit("Patch guard failed: expected exactly one Medium preset line")
          p.write_text(s.replace(old, new))

          # Extend Frame Limit from 30-60 to 30-120 FPS in 5 FPS steps.
          prefs = Path("android/app/src/main/java/com/pes2017/recomp/Prefs.kt")
          ps = prefs.read_text()
          ps, n_get = re.subn(r'\.coerceIn\(30, 60\)', '.coerceIn(30, 120)', ps)
          if n_get != 2:
              raise SystemExit(f"Frame Limit preference patch guard failed: {n_get}")
          prefs.write_text(ps)

          settings = Path("android/app/src/main/java/com/pes2017/recomp/SettingsActivity.kt")
          ss = settings.read_text()
          ss, n_bar = re.subn(r'bar\(R\.id\.fps_limit, R\.id\.fps_limit_label, 6,', 'bar(R.id.fps_limit, R.id.fps_limit_label, 18,', ss)
          old_label = '{ if (it == 6) getString(R.string.fps_limit_off) else getString(R.string.fps_limit, 30 + it * 5) }'
          if n_bar != 1 or ss.count(old_label) != 1:
              raise SystemExit("Frame Limit slider patch guard failed")
          ss = ss.replace(old_label, '{ getString(R.string.fps_limit, 30 + it * 5) }')
          settings.write_text(ss)

          game = Path("android/app/src/main/java/com/pes2017/recomp/GameActivity.kt")
          gs = game.read_text()
          old_limit = '''        val fpsLimit = when {
                      prefs.frameGeneration -> "30"
                      prefs.fpsLimit < 60 -> prefs.fpsLimit.toString()
                      else -> ""
                  }
                  NativeBridge.nativeSetOption("PES17_FPS_LIMIT", fpsOverride?.takeIf { it.isNotEmpty() } ?: fpsLimit)'''
          new_limit = '''        val fpsLimit = when {
                      prefs.frameGeneration -> "30"
                      else -> prefs.fpsLimit.toString()
                  }
                  NativeBridge.nativeSetOption("PES17_FPS_LIMIT", fpsOverride?.takeIf { it.isNotEmpty() } ?: fpsLimit)'''
          if gs.count(old_limit) != 1:
              raise SystemExit("Frame Limit native dispatch patch guard failed")
          game.write_text(gs.replace(old_limit, new_limit))

          frame_rate = Path("runtime/frame_rate.h").read_text()
          if "limit >= kConsole" not in frame_rate or "com_maxfps" not in frame_rate:
              raise SystemExit("Native FPS pacing support verification failed")

          # Extend the texture-memory slider to 12 GB (96 x 128 MB).
          root = Path(".")
          settings = root / "android/app/src/main/java/com/pes2017/recomp/SettingsActivity.kt"
          s = settings.read_text()
          s, n1 = re.subn(r'bar\(R\.id\.texture_budget, R\.id\.texture_label, 15,', 'bar(R.id.texture_budget, R.id.texture_label, 96,', s)
          s, n2 = re.subn(r'\.coerceIn\(1, 15\)', '.coerceIn(1, 96)', s)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Texture slider patch guard failed: max={n1}, clamp={n2}")
          settings.write_text(s)

          # Store a selectable display refresh rate.
          prefs = root / "android/app/src/main/java/com/pes2017/recomp/Prefs.kt"
          s = prefs.read_text()
          old_property = """    var prefer60Hz: Boolean
                  get() = store.getBoolean(KEY_60HZ, true)
                  set(value) = store.edit().putBoolean(KEY_60HZ, value).apply()"""
          new_property = """    var displayRefreshRate: Int
                  get() = store.getInt(KEY_DISPLAY_REFRESH_RATE, 60).let { if (it in intArrayOf(30, 60, 90, 120)) it else 60 }
                  set(value) = store.edit().putInt(KEY_DISPLAY_REFRESH_RATE, value.takeIf { it in intArrayOf(30, 60, 90, 120) } ?: 60).apply()"""
          if s.count(old_property) != 1:
              raise SystemExit("Display preference property patch guard failed")
          s = s.replace(old_property, new_property)
          old_key = '        private const val KEY_60HZ = "prefer60Hz"'
          new_key = '        private const val KEY_DISPLAY_REFRESH_RATE = "displayRefreshRate"'
          if s.count(old_key) != 1:
              raise SystemExit("Display preference key patch guard failed")
          prefs.write_text(s.replace(old_key, new_key))

          # Replace the legacy toggle with a 30/60/90/120-Hz selector.
          settings = root / "android/app/src/main/java/com/pes2017/recomp/SettingsActivity.kt"
          s = settings.read_text()
          old = '        switch(R.id.prefer60, prefs.prefer60Hz) { prefs.prefer60Hz = it }'
          new = '''        run {
              val oldSwitch = findViewById<SwitchCompat>(R.id.prefer60)
              val group = oldSwitch.parent as android.view.ViewGroup
              val index = group.indexOfChild(oldSwitch)
              oldSwitch.visibility = android.view.View.GONE
              if (index + 1 < group.childCount) group.getChildAt(index + 1).visibility = android.view.View.GONE
              val label = TextView(this).apply {
                  text = "Lock Display Refresh Rate"
                  setPadding(0, 8, 0, 4)
              }
              val spinner = android.widget.Spinner(this)
              val labels = listOf("30 Hz", "60 Hz", "90 Hz", "120 Hz")
              val rates = intArrayOf(30, 60, 90, 120)
              spinner.adapter = android.widget.ArrayAdapter(
                  this, android.R.layout.simple_spinner_item, labels
              ).also { it.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item) }
              group.addView(label, index, android.view.ViewGroup.LayoutParams(
                  android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                  android.view.ViewGroup.LayoutParams.WRAP_CONTENT
              ))
              group.addView(spinner, index + 1, android.view.ViewGroup.LayoutParams(
                  android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                  android.view.ViewGroup.LayoutParams.WRAP_CONTENT
              ))
              spinner.setSelection(rates.indexOf(prefs.displayRefreshRate).coerceAtLeast(0), false)
              spinner.onItemSelectedListener = object : android.widget.AdapterView.OnItemSelectedListener {
                  override fun onNothingSelected(parent: android.widget.AdapterView<*>?) = Unit
                  override fun onItemSelected(parent: android.widget.AdapterView<*>?, view: android.view.View?, position: Int, id: Long) {
                      prefs.displayRefreshRate = rates[position]
                  }
              }
          }'''
          if s.count(old) != 1:
              raise SystemExit("Display selector patch guard failed in SettingsActivity.kt")
          settings.write_text(s.replace(old, new))

          # Apply the selected refresh rate, using the closest supported panel mode.
          game = root / "android/app/src/main/java/com/pes2017/recomp/GameActivity.kt"
          s = game.read_text()
          old_game = """        // Frame generation pairs a 30 fps game with a 60 Hz screen (PES17_FRAMEGEN).
                  if (prefs.prefer60Hz || prefs.frameGeneration) {
                      val attributes = window.attributes
                      attributes.preferredRefreshRate = 60f
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val displayObj = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) display
                          else {
                              @Suppress("DEPRECATION")
                              windowManager.defaultDisplay
                          }
                          if (displayObj != null) {
                              val mode60 = displayObj.supportedModes.firstOrNull { kotlin.math.abs(it.refreshRate - 60f) < 1f }
                              if (mode60 != null) {
                                  attributes.preferredDisplayModeId = mode60.modeId
                              }
                          }
                      }
                      window.attributes = attributes
                  }"""
          new_game = """        // Frame generation requires 60 Hz; otherwise use the user's selected panel rate.
                  run {
                      val targetHz = if (prefs.frameGeneration) 60 else prefs.displayRefreshRate
                      val attributes = window.attributes
                      attributes.preferredRefreshRate = targetHz.toFloat()
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val displayObj = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) display else {
                              @Suppress("DEPRECATION")
                              windowManager.defaultDisplay
                          }
                          val mode = displayObj?.supportedModes?.minByOrNull {
                              kotlin.math.abs(it.refreshRate - targetHz.toFloat())
                          }
                          if (mode != null) attributes.preferredDisplayModeId = mode.modeId
                      }
                      window.attributes = attributes
                  }"""
          if s.count(old_game) != 1:
              raise SystemExit("Refresh-rate runtime block patch guard failed in GameActivity.kt")
          game.write_text(s.replace(old_game, new_game))

          # Update diagnostic text after removing the legacy prefer60Hz preference.
          capture = root / "android/app/src/main/java/com/pes2017/recomp/CaptureSession.kt"
          s = capture.read_text()
          old_capture_ref = "60 Hz lock ${prefs.prefer60Hz}"
          new_capture_ref = "selected refresh ${prefs.displayRefreshRate} Hz"
          if s.count(old_capture_ref) != 2:
              raise SystemExit("CaptureSession display preference patch guard failed")
          s = s.replace(old_capture_ref, new_capture_ref)
          if "prefs.prefer60Hz" in s:
              raise SystemExit("Legacy prefer60Hz reference remains in CaptureSession.kt")
          capture.write_text(s)

          # Verify all KOX patches are present before compiling.
          checks = {
              "Dynamic scaling disabled for render-bug isolation": "heatScale = false, loadScale = false" in (root / "android/app/src/main/java/com/pes2017/recomp/DeviceProfile.kt").read_text(),
              "12 GB texture range": "R.id.texture_label, 96," in settings.read_text() and ".coerceIn(1, 96)" in settings.read_text(),
              "refresh rate preference": "var displayRefreshRate: Int" in prefs.read_text(),
              "refresh rate selector": "Lock Display Refresh Rate" in settings.read_text(),
              "runtime refresh rate": "prefs.displayRefreshRate" in game.read_text(),
              "capture diagnostics migrated": "prefs.prefer60Hz" not in (root / "android/app/src/main/java/com/pes2017/recomp/CaptureSession.kt").read_text(),
              "Frame Limit slider to 120": "R.id.fps_limit_label, 18," in settings.read_text(),
              "Frame Limit preference range": ".coerceIn(30, 120)" in prefs.read_text(),
              "Frame Limit native dispatch": "else -> prefs.fpsLimit.toString()" in game.read_text(),
          }
          for name, ok in checks.items():
              print(f"{name}: {'OK' if ok else 'MISSING'}")
          if not all(checks.values()):
              raise SystemExit("KOX patch verification failed")
          PY
      - name: Recompile PES2018 XEX and build native ARM64 library
        working-directory: upstream
        env:
          JOBS: '2'
          PROFILE: balanced
          DIAGNOSTICS: 'OFF'
        run: |
          chmod +x ./build.sh
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          GAME="$PWD/GAME" ./build.sh
          test -s build-android/libpes17.so
          mkdir -p prebuilt/arm64-v8a
          cp build-android/libpes17.so prebuilt/arm64-v8a/libpes17.so
          NDK_LIBCXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -s "$NDK_LIBCXX" || { echo "NDK libc++_shared.so not found: $NDK_LIBCXX"; exit 1; }
          cp "$NDK_LIBCXX" prebuilt/arm64-v8a/libc++_shared.so
          echo "Packaged libc++_shared.so alongside libpes17.so"

      - name: Build release APK
        working-directory: upstream/android
        env:
          PES17_VERSION_NAME: 0.3.2-kox
          PES17_VERSION_CODE: '25'
          PES17_BUILD_SHA: kox-frame120-renderfix
          PES17_BUILD_STAMP: ${{ github.run_number }}
          PES17_NDK_VERSION: 28.2.13676358
          PES17_NATIVE_OPTIMISATION: -O2
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -PprebuiltNative="$GITHUB_WORKSPACE/upstream/prebuilt" \
            :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PES2018-Recomp-KOX-0.3.2
          path: upstream/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

# KOX build workflow: fetch private XEX, recompile native ARM64 code, then package APK.
