      - name: Wire KOX Multi-Patch screen into PATCHES
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          activity_anchor = '        <!-- The import wizard: source, scan, peak space, progress, result. -->'
          activity_block = '''        <activity
                      android:name=".MultiPatchActivity"
                      android:exported="false"
                      android:parentActivityName=".PatchesActivity"
                      android:screenOrientation="fullUser" />

          '''
          if xml.count(activity_anchor) != 1:
              raise SystemExit("Multi-Patch manifest insertion anchor mismatch")
          xml = xml.replace(activity_anchor, activity_block + activity_anchor)
          manifest.write_text(xml)

          activity = Path("android/app/src/main/java/com/pes2017/recomp/PatchesActivity.kt")
          source = activity.read_text()
          anchor = '''        selectFolder.setOnClickListener {
                      folderPicker.launch(Intent(this, GameFolderActivity::class.java))
                  }
          '''
          block = anchor + '''        val multiPatchButton = Button(this).apply {
                      text = "MANAGE MULTI-PATCH"
                      setOnClickListener {
                          startActivity(Intent(this@PatchesActivity, MultiPatchActivity::class.java))
                      }
                  }
                  (selectFolder.parent as? android.view.ViewGroup)?.let { parent ->
                      val position = parent.indexOfChild(selectFolder)
                      parent.addView(
                          multiPatchButton,
                          position + 1,
                          android.view.ViewGroup.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                              android.view.ViewGroup.LayoutParams.WRAP_CONTENT,
                          ),
                      )
                  }
          '''
          if source.count(anchor) != 1:
              raise SystemExit("Multi-Patch button insertion anchor mismatch")
          activity.write_text(source.replace(anchor, block))
          print("KOX Multi-Patch screen registered and linked from PATCHES.")
          PY

      - name: Recompile PES2018 XEX and build native ARM64 library
        working-directory: upstream
        env:
          JOBS: '2'
          PROFILE: balanced
          DIAGNOSTICS: 'OFF'
        run: |
          chmod +x ./build.sh
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          GAME="$PWD/GAME" ./build.sh
          test -s build-android/libpes17.so
          mkdir -p prebuilt/arm64-v8a
          cp build-android/libpes17.so prebuilt/arm64-v8a/libpes17.so
          NDK_LIBCXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -s "$NDK_LIBCXX" || { echo "NDK libc++_shared.so not found: $NDK_LIBCXX"; exit 1; }
          cp "$NDK_LIBCXX" prebuilt/arm64-v8a/libc++_shared.so
          echo "Packaged libc++_shared.so alongside libpes17.so"

      - name: Test KOX DpFileList composer
        working-directory: upstream/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        working-directory: upstream/android
        env:
          PES17_VERSION_NAME: 0.3.2-kox
          PES17_VERSION_CODE: '29'
          PES17_BUILD_SHA: kox-output-resolution-diagnostics
          PES17_BUILD_STAMP: ${{ github.run_number }}
          PES17_NDK_VERSION: 28.2.13676358
          PES17_NATIVE_OPTIMISATION: -O2
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -PprebuiltNative="$GITHUB_WORKSPACE/upstream/prebuilt" \
            :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PES2018-Recomp-KOX-0.3.2
          path: upstream/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

