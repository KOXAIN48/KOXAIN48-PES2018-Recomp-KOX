name: KOX Workflow Syntax Diagnostic

'on':
  push:
    branches:
      - kox-live-controls-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Validate Android workflow
        run: "$HOME/go/bin/actionlint -color .github/workflows/android.yml"
