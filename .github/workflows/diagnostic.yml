name: KOX Actions Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runner-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify GitHub Actions runner
        run: |
          echo "GitHub Actions runner started"
          echo "Runner: $RUNNER_OS"
          echo "Diagnostic workflow syntax and runner are valid"
